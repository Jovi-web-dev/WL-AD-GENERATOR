<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#6366f1" opacity="0.1"/>
  
  <!-- Main circle -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#6366f1" stroke-width="3"/>
  
  <!-- WL Text -->
  <text x="100" y="95" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#6366f1" text-anchor="middle">WL</text>
  
  <!-- IMPORTADOS text -->
  <text x="100" y="125" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#6366f1" text-anchor="middle" opacity="0.8">IMPORTADOS</text>
  
  <!-- Decorative elements -->
  <circle cx="40" cy="100" r="4" fill="#8b5cf6"/>
  <circle cx="160" cy="100" r="4" fill="#8b5cf6"/>
  <circle cx="100" cy="40" r="4" fill="#8b5cf6"/>
  <circle cx="100" cy="160" r="4" fill="#8b5cf6"/>
  
  <!-- AI Badge -->
  <g transform="translate(140, 40)">
    <rect x="0" y="0" width="50" height="24" rx="12" fill="#10b981"/>
    <text x="25" y="16" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">AI</text>
  </g>
</svg>
