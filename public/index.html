<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6366f1" />
    <meta
      name="description"
      content="Plataforma SaaS de Geração de Anúncios com IA - WL Importados Center"
    />
    <title>WL Importados Center - Gerador de Anúncios IA</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: #f8f9fa;
      }

      code {
        font-family: source-code-pro, Menlo, Monaco, Consolas, 'Courier New', monospace;
      }

      #root {
        min-height: 100vh;
      }

      /* Loading animation */
      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-size: 18px;
        color: #6366f1;
        font-weight: 600;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }

      .loading::after {
        content: '...';
        animation: pulse 1.5s ease-in-out infinite;
      }
    </style>
  </head>
  <body>
    <noscript>Você precisa habilitar JavaScript para usar esta aplicação.</noscript>
    <div id="root">
      <div class="loading">Carregando WL Importados Platform</div>
    </div>
  </body>
</html>
